[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-sports-event-os"
version = "1.2.0"
description = "Offline synthetic sports-event modeling and release quality gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5,<4"]

[project.scripts]
sports-os = "sports_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[project.entry-points."sports_os.modules"]
"core.schedule" = "sports_os.modules.schedule:Schedule"
"core.venue" = "sports_os.modules.venue:Venue"
"ticketing.seating" = "sports_os.modules.seating:Seating"
"ticketing.pricing" = "sports_os.modules.pricing:Pricing"
"ticketing.inventory" = "sports_os.modules.inventory:Inventory"
"ticketing.rights" = "sports_os.modules.rights:Rights"
"ticketing.refund" = "sports_os.modules.refund:Refund"
"ticketing.launch" = "sports_os.modules.launch:Launch"
"ticketing.identity" = "sports_os.modules.identity:Identity"
"ticketing.transfer" = "sports_os.modules.transfer:Transfer"
"ticketing.rights_return" = "sports_os.modules.rights_return:RightsReturn"
"finance.revenue" = "sports_os.modules.revenue:Revenue"
"product.pass" = "sports_os.modules.products:Pass"
"product.travel" = "sports_os.modules.travel:Travel"
"project.tasks" = "sports_os.modules.tasks:Tasks"
"project.decisions" = "sports_os.modules.decisions:Decisions"
"demand.multiplicative" = "sports_os.modules.demand:MultiplicativeDemandModel"
"demand.direct" = "sports_os.modules.demand:DirectDemandModel"
"quality.declarations" = "sports_os.modules.quality:QualityDeclarations"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# The codebase is written in a dense one-statement-per-line style and uses star imports
# inside sports_os.modules. These are tracked as follow-ups; enable them one at a time.
ignore = ["E701", "E702", "E501", "F403", "F405", "UP", "E731", "E741", "E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Names imported here are re-exported to every module through `from .common import *`.
"src/sports_os/modules/common.py" = ["F401"]
# Legacy v1.0 compatibility diff: the nested helper runs inside the same loop iteration.
"src/sports_os_legacy/versioning/diff.py" = ["B023"]
